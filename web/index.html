<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Дзвоник — шкільний розклад</title>
    <meta name="title" content="Дзвоник — шкільний розклад" />

    <meta name="theme-color" content="#f59e0b" />
    <meta name="color-scheme" content="light dark" />
    <meta name="msapplication-TileColor" content="#f59e0b" />
    
    <!-- Icons & Apple PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Дзвоник" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Дзвоник — шкільний розклад" />
    <meta property="og:description" content="Офлайн-планувальник шкільного розкладу для завуча." />
    <meta property="og:image" content="/favicon.svg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Дзвоник — шкільний розклад" />
    <meta name="twitter:description" content="Офлайн-планувальник шкільного розкладу для завуча." />
    
    <!-- Humans.txt -->
    <link rel="author" href="/humans.txt" />
    
    <!-- Performance & Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Preconnect to optimize font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Prevent FOUC and theme initialization -->
    <style>
      html { background-color: #faf8f5; overflow-x: hidden; }
      body { margin: 0; min-height: 100vh; background-color: #faf8f5; overflow-x: hidden; }
      html.dark { background-color: #1a1510; }
      html.dark body { background-color: #1a1510; }
      #root { min-height: 100vh; }
    </style>
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('dzvonyk-theme') || localStorage.getItem('fet-dark-mode');
          if (stored === 'dark' || stored === 'true') {
            document.documentElement.classList.add('dark');
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute('content', '#1a1510');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Skip link for accessibility -->
    <a href="#main-content" class="sr-only focus:not-sr-only">Skip to main content</a>
    
    <!-- App Root -->
    <div id="root" role="application" aria-label="Дзвоник — планувальник шкільного розкладу"></div>
    
    <!-- NoScript Fallback -->
    <noscript>
      <div style="padding: 2rem; text-align: center; color: #e5e0d8; font-family: system-ui, sans-serif;">
        <h1>Дзвоник — шкільний розклад</h1>
        <p>Потрібен JavaScript. Увімкніть його в налаштуваннях браузера та оновіть сторінку.</p>
        <p>Вихідний код (AGPL-3.0): https://github.com/shogi-dojo/dzvonyk</p>
      </div>
    </noscript>
    
    <!-- Main Application Script -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
