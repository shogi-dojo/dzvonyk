<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>FET Web - Free Educational Timetabling</title>
    <meta name="title" content="FET Web - Free Educational Timetabling" />
    <meta name="description" content="Create optimal school and university timetables with FET Web. Free, open-source, and privacy-focused educational scheduling software that runs entirely in your browser." />
    <meta name="author" content="FET Web Contributors" />
    <meta name="keywords" content="timetable, scheduling, education, school, university, FET, free, open-source" />
    
    <!-- Theme & Colors -->
    <meta name="theme-color" content="#1a1510" />
    <meta name="color-scheme" content="dark" />
    <meta name="msapplication-TileColor" content="#1a1510" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/vite.svg" color="#f59e0b" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FET Web - Free Educational Timetabling" />
    <meta property="og:description" content="Create optimal school and university timetables with FET Web. Free, open-source, and privacy-focused." />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FET Web - Free Educational Timetabling" />
    <meta name="twitter:description" content="Create optimal school and university timetables with FET Web. Free, open-source, and privacy-focused." />
    
    <!-- Humans.txt -->
    <link rel="author" href="/humans.txt" />
    
    <!-- Performance & Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Preconnect to optimize font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Prevent FOUC -->
    <style>
      html { background-color: #1a1510; }
      body { margin: 0; min-height: 100vh; background-color: #1a1510; }
      #root { min-height: 100vh; }
    </style>

  <body class="dark">

    <!-- App Root -->
    <div id="root" role="application" aria-label="FET Web Timetabling Application"></div>

    <noscript>
      <div style="padding: 2rem; text-align: center; color: #e5e0d8; font-family: system-ui, sans-serif;">
