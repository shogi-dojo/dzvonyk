name: CI

# CI never contacts production services. These explicit placeholders exercise
# the same fail-fast configuration path without exposing deployment values.
env:
  VITE_FIREBASE_API_KEY: ci-placeholder-api-key
  VITE_FIREBASE_AUTH_DOMAIN: ci.invalid
  VITE_FIREBASE_PROJECT_ID: ci-project
  VITE_FIREBASE_STORAGE_BUCKET: ci.invalid
  VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
  VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
  VITE_FIREBASE_MEASUREMENT_ID: G-TEST000000
  VITE_FIREBASE_FUNCTIONS_REGION: europe-central2
  VITE_FEEDBACK_EMAIL: feedback@example.invalid
  VITE_DONATE_URL: ''

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc -b
      - run: npx vitest run
      - run: VITE_DISABLE_PWA=true npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: VITE_DISABLE_PWA=true npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
